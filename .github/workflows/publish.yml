name: Publish npm release
run-name: npm ${{ inputs.version }} (${{ inputs.publish && 'publish' || 'preview' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact npm version, e.g. 9.0.0-rc.1 (first release) or 9.0.0'
        required: true
        type: string
      publish:
        description: Publish to npm (unchecked builds and tests downloadable tarballs only)
        type: boolean
        default: false
      rc_verified:
        description: I have installed and verified an RC for this stable version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/npm-release.test.mjs test/color-sequence.test.mjs
      - name: Validate version and check npm
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RC_VERIFIED: ${{ inputs.rc_verified }}
        run: node scripts/npm-release.mjs

  platforms:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  linux:
    needs: validate
    uses: ./.github/workflows/build-linux-x64.yml

  pack:
    needs: [validate, platforms, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: artifacts
      # All four platforms are mandatory for releases.
      - name: Prepare and pack all packages
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node scripts/npm-prepare.mjs --artifacts artifacts --version "$RELEASE_VERSION"
          mkdir packed
          for dir in npm/*/; do npm pack --pack-destination packed "./$dir"; done
      - name: Test Linux package and browser round trip
        run: |
          mkdir app && cd app
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../packed/vramana-ffmpeg-[0-9]*.tgz ../packed/vramana-ffmpeg-linux-x64-*.tgz puppeteer
          npx ffmpeg -hide_banner -version
          npx ffprobe -hide_banner -version
          cp ../test/browser.test.mjs ../test/color-sequence.mjs .
          node --test browser.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ needs.validate.outputs.version }}
          path: packed/*.tgz
          if-no-files-found: error
      - name: Summarize prepared release
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          echo "Prepared all five packages at $RELEASE_VERSION (npm tag: $RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA. Tarballs are in the npm-release-$RELEASE_VERSION artifact." >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: inputs.publish
    needs: [validate, pack]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-${{ needs.validate.outputs.version }}
          path: packed
      - name: Recheck npm immediately before publishing
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RC_VERIFIED: ${{ inputs.rc_verified }}
        run: node scripts/npm-release.mjs
      # npm prefers OIDC when trusted publishers are configured. The token
      # supports the initial publication before package settings exist on npm.
      - name: Publish platform packages, then the main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          for file in packed/vramana-ffmpeg-{darwin-arm64,linux-x64,win32-arm64,win32-x64}-*.tgz; do
            npm publish "./$file" --access public --provenance --tag "$RELEASE_TAG"
          done
          npm publish ./packed/vramana-ffmpeg-[0-9]*.tgz --access public --provenance --tag "$RELEASE_TAG"
      - name: Summarize publication
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          echo "Published all five packages at $RELEASE_VERSION under $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          echo "Install with: npm install @vramana/ffmpeg@$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
