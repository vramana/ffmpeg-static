name: Build linux-x64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build static ffmpeg in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 \
            sh -c 'sh scripts/build-linux.sh && chown -R '"$(id -u):$(id -g)"' dist'

      - name: Smoke test
        run: sh scripts/smoke-test.sh dist

      - name: Smoke test on a minimal distro image
        run: docker run --rm -v "$PWD:/src:ro" -w /src debian:bookworm-slim sh scripts/smoke-test.sh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-x64
          path: |
            dist/ffmpeg
            dist/ffprobe
          if-no-files-found: error
