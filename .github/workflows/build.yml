name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to use for the package installation tests
        type: string
        required: false
        default: ''

jobs:
  macos:
    name: darwin-arm64
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install meson ninja pkgconf

      - name: Build
        run: TARGET=darwin-arm64 sh scripts/build.sh

      - name: Smoke test
        run: sh scripts/smoke-test.sh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-darwin-arm64
          path: |
            dist/ffmpeg
            dist/ffprobe
          if-no-files-found: error

  windows:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-2025
            msystem: UCRT64
            cc: gcc
            cxx: g++
            tools: toolchain:p cmake:p ninja:p meson:p pkgconf:p zlib:p nasm:p
          - target: win32-arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            cc: clang
            cxx: clang++
            tools: toolchain:p cmake:p ninja:p meson:p pkgconf:p zlib:p
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git make diffutils perl curl tar
          pacboy: ${{ matrix.tools }}

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: TARGET=${{ matrix.target }} sh scripts/build.sh

      - name: Smoke test
        run: sh scripts/smoke-test.sh dist

      # Outside MSYS2 nothing from MinGW is on PATH, so a missing DLL shows up here.
      - name: Run outside MSYS2
        shell: pwsh
        run: |
          .\dist\ffmpeg.exe -hide_banner -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\ffprobe.exe -hide_banner -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: |
            dist/ffmpeg.exe
            dist/ffprobe.exe
          if-no-files-found: error

  package:
    name: npm packages
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test color sequence normalization
        run: node --test test/color-sequence.test.mjs

      - name: Test release validation
        run: node --test test/npm-release.test.mjs

      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: artifacts

      # linux-x64 is built by its own (manual) workflow, so allow it to be missing.
      - name: Prepare packages
        env:
          PACKAGE_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}
        run: node scripts/npm-prepare.mjs --artifacts artifacts --version "$PACKAGE_VERSION" --allow-missing

      - name: Pack
        run: |
          mkdir -p packed
          for dir in npm/*/; do npm pack --pack-destination packed "./$dir"; done

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: packed/*.tgz
          if-no-files-found: error

  test-package:
    name: npm install (${{ matrix.target }})
    needs: package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: win32-x64, runner: windows-2025 }
          - { target: win32-arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: packed

      # The other platforms' packages aren't on the registry; npm skips those
      # optional dependencies, and the local tarball provides this platform's.
      - name: Install
        run: |
          mkdir app && cd app
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../packed/vramana-ffmpeg-[0-9]*.tgz ../packed/vramana-ffmpeg-${{ matrix.target }}-*.tgz

      - name: Use the package
        working-directory: app
        run: |
          node -e "const f = require('@vramana/ffmpeg'); console.log(f.ffmpegPath, f.ffprobePath)"
          node --input-type=module -e "import { ffmpegPath } from '@vramana/ffmpeg'; console.log(ffmpegPath)"
          npx ffmpeg -hide_banner -version
          npx ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=duration=1 -c:v libx264 -y out.mp4
          npx ffprobe -hide_banner -loglevel error -show_entries stream=codec_name -of csv=p=0 out.mp4

      # Chrome records a video that ffmpeg must decode, and plays back videos
      # ffmpeg encoded; see test/browser.test.mjs.
      - name: Browser round-trip test
        working-directory: app
        run: |
          npm install --no-audit --no-fund puppeteer
          cp ../test/browser.test.mjs ../test/color-sequence.mjs .
          node --test browser.test.mjs
